[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flashmini"
version = "0.0.1"
description = "Local-first terminal AI coding assistant for 8 GB-class hardware"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Isaac Balintay" }]
keywords = ["llm", "llama-cpp", "coding-assistant", "local-first", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
# Dependencies are added per-phase as components land; none are declared
# until the code that needs them exists.
dependencies = [
    "pydantic>=2.14.2",
]

[project.urls]
Homepage = "https://github.com/balintayisaac/flashmini"
Issues = "https://github.com/balintayisaac/flashmini/issues"

[project.scripts]
flashmini = "flashmini.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flashmini"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
# E501 handled by formatter where reasonable; keep strict defaults otherwise.

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

